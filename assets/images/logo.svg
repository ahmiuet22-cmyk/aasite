<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="100%" height="100%" class="aa-brand-svg">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00" />
      <stop offset="100%" stop-color="#FF5100" />
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2C2D30" />
      <stop offset="100%" stop-color="#141517" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#FF5100" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Left Dark 'A' -->
  <path d="M 60 130 L 125 35 L 175 105 L 148 105 L 125 68 L 90 120 Z" fill="url(#darkGrad)"/>
  
  <!-- Right Orange 'A' -->
  <path d="M 145 130 L 210 35 L 285 130 L 250 130 L 235 110 L 175 110 L 163 130 Z" fill="url(#orangeGrad)" filter="url(#glow)"/>
  <polygon points="210,65 190,95 225,95" fill="#FFFFFF" fill-opacity="0.08"/>

  <!-- Orange Swoosh connecting the two A's -->
  <path d="M 60 130 C 110 95 180 90 235 110 C 180 98 120 108 72 133 Z" fill="url(#orangeGrad)"/>

  <!-- House Outline & Chimney -->
  <path d="M 255 88 L 290 55 L 325 88 L 315 88 L 315 100 L 265 100 L 265 88 Z" fill="#1E2024"/>
  <!-- House Door/Window -->
  <rect x="282" y="74" width="16" height="18" fill="#FFFFFF" opacity="0.9" rx="2"/>
  
  <!-- Brick Chimney -->
  <path d="M 305 45 L 335 45 L 335 95 L 305 95 Z" fill="#1A1C1E"/>
  <rect x="303" y="42" width="34" height="5" fill="#2C2E33" rx="1"/>
  <!-- Chimney Brick lines -->
  <line x1="305" y1="56" x2="335" y2="56" stroke="#FFFFFF" stroke-width="1.2" opacity="0.4"/>
  <line x1="305" y1="68" x2="335" y2="68" stroke="#FFFFFF" stroke-width="1.2" opacity="0.4"/>
  <line x1="305" y1="80" x2="335" y2="80" stroke="#FFFFFF" stroke-width="1.2" opacity="0.4"/>
  <line x1="320" y1="45" x2="320" y2="56" stroke="#FFFFFF" stroke-width="1.2" opacity="0.4"/>
  <line x1="312" y1="56" x2="312" y2="68" stroke="#FFFFFF" stroke-width="1.2" opacity="0.4"/>
  <line x1="328" y1="56" x2="328" y2="68" stroke="#FFFFFF" stroke-width="1.2" opacity="0.4"/>
  <line x1="320" y1="68" x2="320" y2="80" stroke="#FFFFFF" stroke-width="1.2" opacity="0.4"/>

  <!-- Rubble Pile in Skip -->
  <path d="M 270 102 C 275 80, 310 75, 335 78 C 360 75, 395 85, 405 102 Z" fill="#25272B"/>
  <polygon points="280,95 295,85 305,96 290,102" fill="#3D4148"/>
  <polygon points="310,88 330,76 345,90 325,98" fill="#4B5058"/>
  <polygon points="340,92 360,82 375,94 355,102" fill="#383C42"/>
  <polygon points="370,95 385,88 398,98 382,104" fill="#4B5058"/>

  <!-- Construction Waste Skip / Dumpster Container -->
  <polygon points="285,102 395,102 380,132 300,132" fill="url(#orangeGrad)" stroke="#111" stroke-width="2"/>
  <line x1="282" y1="102" x2="398" y2="102" stroke="#FF8533" stroke-width="4"/>
  <!-- Skip Ribs / Reinforcements -->
  <line x1="320" y1="104" x2="315" y2="130" stroke="#D34500" stroke-width="2"/>
  <line x1="360" y1="104" x2="365" y2="130" stroke="#D34500" stroke-width="2"/>
  <!-- Skip Base feet -->
  <rect x="305" y="132" width="12" height="4" fill="#1A1A1A"/>
  <rect x="363" y="132" width="12" height="4" fill="#1A1A1A"/>

  <!-- MAIN BRAND TEXT -->
  <text x="25" y="180" font-family="'Montserrat', 'Poppins', sans-serif" font-weight="900" font-size="46" fill="#181A1D" letter-spacing="1">AA</text>
  <text x="110" y="180" font-family="'Montserrat', 'Poppins', sans-serif" font-weight="900" font-size="46" fill="url(#orangeGrad)" letter-spacing="2">SITE</text>
  <text x="235" y="180" font-family="'Montserrat', 'Poppins', sans-serif" font-weight="900" font-size="46" fill="#181A1D" letter-spacing="1">SOLUTIONS</text>

  <!-- SUBTITLE WITH ORANGE LINES -->
  <line x1="25" y1="198" x2="70" y2="198" stroke="url(#orangeGrad)" stroke-width="3" stroke-linecap="round"/>
  <text x="80" y="202" font-family="'Inter', sans-serif" font-weight="800" font-size="13.5" fill="#1C1E21" letter-spacing="4">WASTE REMOVAL</text>
  <line x1="238" y1="194" x2="238" y2="204" stroke="url(#orangeGrad)" stroke-width="2"/>
  <text x="250" y="202" font-family="'Inter', sans-serif" font-weight="800" font-size="13.5" fill="#1C1E21" letter-spacing="4">BUILDING SERVICE</text>
  <line x1="430" y1="198" x2="475" y2="198" stroke="url(#orangeGrad)" stroke-width="3" stroke-linecap="round"/>
</svg>
